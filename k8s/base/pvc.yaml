apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: telco-agent-data
spec:
  accessModes:
    - ReadWriteOnce        # Azure Disk default — single-pod attachment.
  storageClassName: managed-csi   # Default StorageClass on AKS.
  resources:
    requests:
      storage: 1Gi         # Overridden in prod overlay.
