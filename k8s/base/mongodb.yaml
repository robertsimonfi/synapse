---
# PVC for MongoDB data — 2 Gi on Azure Disk (ReadWriteOnce, single pod).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synapse-mongodb-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synapse-mongodb
  template:
    metadata:
      labels:
        app: synapse-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: synapse-mongodb-data

---
apiVersion: v1
kind: Service
metadata:
  name: synapse-mongodb
spec:
  selector:
    app: synapse-mongodb
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP
