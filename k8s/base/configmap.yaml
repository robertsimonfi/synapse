apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse-config
data:
  # Defaults for both envs. Overlay-specific values (e.g. CLAUDE_MODEL,
  # log levels) can be overridden via overlays/{dev,prod}/configmap-patch.yaml.
  DB_TYPE: "sqlite"
  SQLITE_PATH: "/data/telco_dev.db"
  RAG_CHROMA_PATH: "/data/chromadb"
  AGENT_MEMORY_PATH: "/data/agent_memory"
  AUTO_SEED: "true"
  AUTO_INGEST: "true"
  CLAUDE_MODEL: "claude-opus-4-6"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
