apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Resources shared by both environments. Per-env values are layered on top
# in k8s/overlays/{dev,prod}.
resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Both overlays override the image fully (registry + tag) at deploy time:
#   kustomize edit set image synapse=<acr>.azurecr.io/synapse:sha-<commit>
images:
  - name: synapse
    newTag: placeholder

# Common labels stamped on every resource.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: synapse
      app.kubernetes.io/part-of: synapse
