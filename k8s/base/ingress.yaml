apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synapse
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    # Core /resolve drives the 9-step agent loop (Claude Opus tool-use, up to
    # 10 iterations, plus critic + memory + policy). End-to-end can hit 30–90 s
    # on AKS. 60 s was the original default — promoted to 300 s to match the
    # chatbot gateway httpx client and inner nginx so the public path stops 504-ing.
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout:    "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout:    "300"
spec:
  ingressClassName: nginx
  rules:
    # Hostname is patched per-environment in the overlays:
    #   dev  → dev.<lb-ip>.nip.io
    #   prod → prod.<lb-ip>.nip.io
    # The literal __LB_IP__ token is replaced at deploy time by the workflow.
    - host: PATCHED_BY_OVERLAY
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: synapse
                port:
                  number: 80
