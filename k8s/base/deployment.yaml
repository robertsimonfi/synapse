apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
spec:
  replicas: 1
  # SQLite + local ChromaDB are bound to a single ReadWriteOnce PVC, so we
  # MUST stop the old pod before the new one starts. RollingUpdate would try
  # to attach the same disk to two pods → CrashLoopBackOff.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: synapse-workload
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # Matches the `app` user baked into the image.
        runAsGroup: 999
        fsGroup: 999            # Lets the pod write into the mounted volume.
      containers:
        - name: api
          image: synapse    # Replaced by overlay/CI: kustomize edit set image synapse=<full-uri>
          # Always pull. Without this, deploying with a mutable tag like :latest
          # silently runs whatever's cached on the node — bit us once already in
          # prod when an old :latest was sitting on the node and IfNotPresent
          # never re-pulled the fixed image.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: synapse-config
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: synapse-secrets
                  key: ANTHROPIC_API_KEY
            - name: TELCO_AGENT_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: synapse-secrets
                  key: TELCO_AGENT_API_KEYS
          volumeMounts:
            - name: data
              mountPath: /data
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Resources are env-specific — overlays patch these.
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: synapse-data
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: synapse-akv
