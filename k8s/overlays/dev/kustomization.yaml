apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: synapse-dev

resources:
  - ../../base
  - namespace.yaml
  - secret-provider.yaml

# Image is set at deploy time by the workflow:
#   kustomize edit set image synapse=<acr>.azurecr.io/synapse:sha-<commit>
images:
  - name: synapse
    newName: acrsynapse18683.azurecr.io/synapse
    newTag: sha-ea1d0cb  # overwritten by CI on each deploy

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: synapse
  - path: pvc-patch.yaml
    target:
      kind: PersistentVolumeClaim
      name: synapse-data
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: synapse

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/instance: synapse-dev
      env: dev
