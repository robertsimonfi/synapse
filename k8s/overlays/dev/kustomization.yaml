apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: telco-agent-dev

resources:
  - ../../base
  - namespace.yaml

# Image is set at deploy time by the workflow:
#   kustomize edit set image telco-agent=<acr>.azurecr.io/telco-agent:sha-<commit>
images:
  - name: telco-agent
    newTag: dev-latest

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: telco-agent
  - path: pvc-patch.yaml
    target:
      kind: PersistentVolumeClaim
      name: telco-agent-data
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: telco-agent

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/instance: telco-agent-dev
      env: dev
