apiVersion: v1
kind: ServiceAccount
metadata:
  name: synapse-workload
  annotations:
    # az identity show -n mi-telco-agent-dev -g rg-synapse --query clientId -o tsv
    azure.workload.identity/client-id: "0809f633-38ad-40d0-9029-135df761ca90"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: synapse-akv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    # az identity show -n mi-telco-agent-dev -g rg-synapse --query clientId -o tsv
    clientID: "0809f633-38ad-40d0-9029-135df761ca90"
    keyvaultName: "kv-synapse18683"
    # az account show --query tenantId -o tsv
    tenantId: "2aba0430-a6ae-4f6e-96eb-4a0f8123a70f"
    objects: |
      array:
        - |
          objectName: ANTHROPIC-API-KEY
          objectType: secret
          objectVersion: ""
        - |
          objectName: TELCO-AGENT-API-KEYS-DEV
          objectType: secret
          objectVersion: ""
  # secretObjects causes the CSI driver to mirror the mounted secrets into a
  # K8s Secret. This is required so the existing secretKeyRef env vars in the
  # deployment keep working without any app-level changes.
  secretObjects:
    - secretName: synapse-secrets
      type: Opaque
      data:
        - objectName: ANTHROPIC-API-KEY
          key: ANTHROPIC_API_KEY
        - objectName: TELCO-AGENT-API-KEYS-DEV
          key: TELCO_AGENT_API_KEYS
