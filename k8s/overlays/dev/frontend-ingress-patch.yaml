apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synapse-noc
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - noc.42-ds.net
      secretName: synapse-noc-dev-tls
  rules:
    - host: noc.42-ds.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: synapse-noc
                port:
                  number: 80
