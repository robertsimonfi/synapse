# Real domain + auto-HTTPS via cert-manager + Let's Encrypt.
# - cert-manager.io/cluster-issuer triggers cert-manager to fetch a cert
#   for the listed hosts via the HTTP-01 challenge through this ingress.
# - ssl-redirect=true tells NGINX to 308 plain HTTP → HTTPS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: telco-agent
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - dev.42-ds.net
      secretName: telco-agent-dev-tls
  rules:
    - host: dev.42-ds.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: telco-agent
                port:
                  number: 80
