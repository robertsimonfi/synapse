apiVersion: v1
kind: ServiceAccount
metadata:
  name: synapse-workload
  annotations:
    # az identity show -n mi-telco-agent-prod -g rg-synapse --query clientId -o tsv
    azure.workload.identity/client-id: "d6bb07cd-ffff-4756-9b9d-81e4357e4f7b"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: synapse-akv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    # az identity show -n mi-telco-agent-prod -g rg-synapse --query clientId -o tsv
    clientID: "d6bb07cd-ffff-4756-9b9d-81e4357e4f7b"
    keyvaultName: "kv-synapse"
    # az account show --query tenantId -o tsv
    tenantId: "2aba0430-a6ae-4f6e-96eb-4a0f8123a70f"
    objects: |
      array:
        - |
          objectName: ANTHROPIC-API-KEY
          objectType: secret
          objectVersion: ""
        - |
          objectName: TELCO-AGENT-API-KEYS-PROD
          objectType: secret
          objectVersion: ""
  secretObjects:
    - secretName: synapse-secrets
      type: Opaque
      data:
        - objectName: ANTHROPIC-API-KEY
          key: ANTHROPIC_API_KEY
        - objectName: TELCO-AGENT-API-KEYS-PROD
          key: TELCO_AGENT_API_KEYS
