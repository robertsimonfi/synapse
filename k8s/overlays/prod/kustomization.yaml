apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: telco-agent-prod

resources:
  - ../../base
  - namespace.yaml

images:
  - name: telco-agent
    newTag: prod-latest

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: telco-agent
  - path: pvc-patch.yaml
    target:
      kind: PersistentVolumeClaim
      name: telco-agent-data
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: telco-agent

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/instance: telco-agent-prod
      env: prod
