apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: synapse-prod

resources:
  - ../../base
  - namespace.yaml
  - secret-provider.yaml

images:
  - name: synapse
    newTag: prod-latest

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: synapse
  - path: pvc-patch.yaml
    target:
      kind: PersistentVolumeClaim
      name: synapse-data
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: synapse

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/instance: synapse-prod
      env: prod
