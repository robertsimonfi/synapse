# Real domain + auto-HTTPS via cert-manager + Let's Encrypt.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synapse
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - prod.42-ds.net
      secretName: synapse-prod-tls
  rules:
    - host: prod.42-ds.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: synapse
                port:
                  number: 80
