# Hostname uses nip.io: prod.<lb-ip>.nip.io resolves to the LB IP automatically.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: telco-agent
spec:
  rules:
    - host: prod.__LB_IP__.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: telco-agent
                port:
                  number: 80
