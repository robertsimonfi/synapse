# Synapse — Phase 9 full local-dev stack.
#
# Architecture:
#   kafka           — Kafka 3.7 (KRaft mode, no ZooKeeper)
#   mongodb         — Action state store + ODS subscribers + outbox
#   api             — FastAPI: resolve, HITL endpoints, Prometheus /metrics
#   thinker         — Kafka consumer → Claude → MongoDB action proposals
#   executor        — APPROVED actions → execute → MongoDB outbox write
#   watchdog        — PENDING/APPROVED drift check → Kafka re-analysis
#   hydrator        — Oracle CDC simulation → Kafka → MongoDB ODS
#   relay           — MongoDB outbox → Kafka legacy.commands.writeback
#   oracle_adapter  — Kafka → Oracle DML write-back
#   prefetch        — Phase 12: predictive subscriber pre-hydration
#   canary          — Phase 12: model quality A/B scoring
#   sentiment       — Phase 14: customer feedback Kafka consumer
#   prompt-optimizer— Phase 15: autonomous prompt improvement
#   archiver        — Phase 15: cold-tier ODS document archival
#   prometheus      — Scrapes /metrics from the API
#   frontend        — React NOC Dashboard (Phase 14)
#   ui              — Streamlit Operator Portal (fallback)
#
# Kafka replaces RabbitMQ for all inter-service messaging (Phase 9).
# For production: replace SQLite with managed Oracle, local ChromaDB with
# Azure AI Search, and scale each service as independent AKS Deployments.

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  kafka:
    image: apache/kafka:3.7.0
    container_name: synapse-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # KRaft mode — no ZooKeeper required
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 536870912
      # Single-broker overrides — apache/kafka defaults to RF=3 which breaks a
      # one-node KRaft cluster. __consumer_offsets and __transaction_state must
      # be created with RF=1 so the GroupCoordinator can initialise.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Fixed cluster ID for local dev (KRaft requires this to be stable across restarts)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: synapse-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: synapse
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: synapse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  # ── Application ─────────────────────────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: telco-agent:local
    container_name: synapse-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_TYPE: sqlite
      SQLITE_PATH: /data/telco_dev.db
      RAG_CHROMA_PATH: /data/chromadb
      AGENT_MEMORY_PATH: /data/agent_memory
      AUTO_SEED: "true"
      AUTO_INGEST: "true"
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: synapse
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ACTION_EXPIRY_HOURS: "4"
      EXPIRY_CHECK_INTERVAL_MINUTES: "15"
    volumes:
      - telco_data:/data
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    restart: unless-stopped

  thinker:
    image: telco-agent:local
    container_name: synapse-thinker
    command: ["python", "-m", "worker.thinker"]
    env_file:
      - .env
    environment:
      DB_TYPE: sqlite
      SQLITE_PATH: /data/telco_dev.db
      RAG_CHROMA_PATH: /data/chromadb
      AGENT_MEMORY_PATH: /data/agent_memory
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: synapse
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - telco_data:/data
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  executor:
    image: telco-agent:local
    container_name: synapse-executor
    command: ["python", "-m", "worker.executor"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: synapse
      EXECUTOR_POLL_INTERVAL: "10"
      SQLITE_PATH: /data/telco_dev.db
    volumes:
      - telco_data:/data
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  watchdog:
    image: telco-agent:local
    container_name: synapse-watchdog
    command: ["python", "-m", "worker.watchdog"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: synapse
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WATCHDOG_POLL_INTERVAL: "30"
      SQLITE_PATH: /data/telco_dev.db
    volumes:
      - telco_data:/data
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  hydrator:
    image: telco-agent:local
    container_name: synapse-hydrator
    command: ["python", "-m", "worker.hydrator"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: synapse
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_TYPE: sqlite
      SQLITE_PATH: /data/telco_dev.db
      HYDRATOR_POLL_INTERVAL: "30"
      HYDRATOR_BATCH_SIZE: "200"
      HYDRATOR_CHECKPOINT_FILE: /data/hydrator_checkpoint.json
    volumes:
      - telco_data:/data
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  relay:
    image: telco-agent:local
    container_name: synapse-relay
    command: ["python", "-m", "worker.relay"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: synapse
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RELAY_POLL_INTERVAL: "5"
      RELAY_BATCH_SIZE: "50"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  oracle_adapter:
    image: telco-agent:local
    container_name: synapse-oracle-adapter
    command: ["python", "-m", "worker.oracle_adapter"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: synapse
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_TYPE: sqlite
      SQLITE_PATH: /data/telco_dev.db
      ORACLE_ADAPTER_MAX_RETRIES: "3"
    volumes:
      - telco_data:/data
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  prefetch:
    image: telco-agent:local
    container_name: synapse-prefetch
    command: ["python", "-m", "worker.prefetch"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: synapse
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PREFETCH_CONCURRENCY: "50"
      PREFETCH_MAX_CUSTOMERS: "2000"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      hydrator:
        condition: service_started
    restart: unless-stopped

  canary:
    image: telco-agent:local
    container_name: synapse-canary
    command: ["python", "-m", "worker.canary"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: synapse
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CANARY_WINDOW_MINUTES: "60"
      CANARY_MIN_SUCCESS_RATE: "0.85"
      CANARY_MIN_SAMPLES: "100"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  sentiment:
    image: telco-agent:local
    container_name: synapse-sentiment
    command: ["python", "-m", "worker.sentiment"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: synapse
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  prompt-optimizer:
    image: telco-agent:local
    container_name: synapse-prompt-optimizer
    command: ["python", "-m", "worker.prompt_optimizer"]
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: synapse
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SQLITE_PATH: /data/telco_dev.db
    volumes:
      - telco_data:/data
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  archiver:
    image: telco-agent:local
    container_name: synapse-archiver
    command: ["python", "-m", "worker.archiver"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: synapse
      ARCHIVER_COLD_THRESHOLD_DAYS: "30"
      ARCHIVER_RUN_INTERVAL_HOURS: "6"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # ── Phase 14: React NOC Dashboard ───────────────────────────────────────────

  frontend:
    image: node:20-alpine
    container_name: synapse-frontend
    working_dir: /app
    # Dev server: lighter than build+preview, and the server.proxy in
    # vite.config.ts already forwards /api and /ws to api:8000.
    # The anonymous volume for node_modules ensures npm installs Linux-native
    # binaries (e.g. esbuild) instead of reusing any Windows-built ones from
    # the host mount, which would crash in Alpine.
    command: sh -c "npm install --silent && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_TARGET: http://api:8000
      VITE_API_KEY: dev-local-key-synapse
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Streamlit portal (fallback) ──────────────────────────────────────────────

  ui:
    image: telco-agent:local
    container_name: synapse-ui
    command:
      - "streamlit"
      - "run"
      - "ui/operator_portal.py"
      - "--server.port=8501"
      - "--server.address=0.0.0.0"
      - "--server.headless=true"
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
      SYNAPSE_API_KEY: dev-local-key-synapse
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  telco_data:
    driver: local
  mongo_data:
    driver: local
  kafka_data:
    driver: local
  prometheus_data:
    driver: local
