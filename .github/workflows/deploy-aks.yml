name: Deploy to AKS

# Triggered:
#   - Automatically by ci.yml after a successful build (environment=dev)
#   - Manually for prod (or any env) via workflow_dispatch
#
# Prod is gated by the GitHub Environment "prod" — set required reviewers
# under: Settings → Environments → prod → Required reviewers.
#
# Required GitHub secrets (all created by infra/azure-setup.sh):
#   AZURE_CREDENTIALS         — service-principal JSON (--sdk-auth output)
#   AZURE_RESOURCE_GROUP      — e.g. rg-telco-agent
#   AKS_CLUSTER_NAME          — e.g. aks-telco-agent
#   ACR_NAME                  — e.g. acrtelcoagent42
#   ACR_LOGIN_SERVER          — e.g. acrtelcoagent42.azurecr.io
#
# Secrets are NO LONGER managed here. They live in Azure Key Vault (kv-telco-agent)
# and are synced into the telco-agent-secrets K8s Secret by the CSI Secret Store
# driver using Workload Identity. Ensure the following AKV secrets exist:
#   ANTHROPIC-API-KEY         — Anthropic API key
#   TELCO-AGENT-API-KEYS      — comma-separated X-API-Key values (different per env)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      image_tag:
        description: "Image tag from GHCR (e.g. sha-abc1234, latest)"
        required: true
        default: latest

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}    # ← prod environment requires manual approval
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Server-side copy from GHCR → ACR. No rebuild, no local pull.
      # `--force` lets us re-import if a tag already exists.
      - name: Import image GHCR → ACR (Docker natively)
        run: |
          # 1. Log into GitHub Container Registry
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          
          # 2. Log into Azure Container Registry
          az acr login --name "${{ secrets.ACR_NAME }}"
          
          # 3. Pull the image from GitHub
          docker pull ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}
          
          # 4. Retag the image for Azure
          docker tag ghcr.io/${{ github.repository }}:${{ inputs.image_tag }} ${{ secrets.ACR_LOGIN_SERVER }}/telco-agent:${{ inputs.image_tag }}
          
          # 5. Push the image into Azure
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/telco-agent:${{ inputs.image_tag }}
          
      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name:   ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Render manifests (pin image)
        env:
          NS:           telco-agent-${{ inputs.environment }}
          IMAGE_REF:    ${{ secrets.ACR_LOGIN_SERVER }}/telco-agent:${{ inputs.image_tag }}
          OVERLAY_DIR:  k8s/overlays/${{ inputs.environment }}
        run: |
          # Pin the deployed image to the exact tag we just imported.
          (cd "${OVERLAY_DIR}" && \
            kustomize edit set image "telco-agent=${IMAGE_REF}")

          # Render & show what will be applied (handy in run logs).
          kubectl kustomize "${OVERLAY_DIR}" > /tmp/manifests.yaml
          echo "── Rendered manifests ──"
          grep -E '^(apiVersion|kind|  name:|  namespace:|  - host:|        image:)' /tmp/manifests.yaml || true

      - name: Ensure namespace exists
        env:
          NS: telco-agent-${{ inputs.environment }}
        run: |
          kubectl get ns "${NS}" >/dev/null 2>&1 || kubectl create ns "${NS}"

      - name: Apply manifests
        run: kubectl apply -f /tmp/manifests.yaml

      - name: Wait for rollout
        env:
          NS: telco-agent-${{ inputs.environment }}
        run: |
          kubectl -n "${NS}" rollout status deployment/telco-agent --timeout=5m

      - name: Show endpoint
        env:
          ENV: ${{ inputs.environment }}
        run: |
          URL="https://${ENV}.42-ds.net"
          echo ""
          echo "✓ Deployed to: ${URL}"
          echo "  Health:      ${URL}/health"
          echo "  Swagger:     ${URL}/docs"
          echo ""
          echo "::notice title=Deployed::${URL}/docs"
