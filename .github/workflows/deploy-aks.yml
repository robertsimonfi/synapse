name: Deploy to AKS

# Triggered:
#   - Automatically on push to main/develop → deploys latest to dev
#   - Manually via workflow_dispatch → any env + tag (prod requires approval)
#
# Required GitHub secrets:
#   AZURE_CREDENTIALS  — service-principal JSON
#   CLUSTER_NAME       — AKS cluster name (aks-synapse)

env:
  ACR_NAME: acrsynapse18683
  ACR_LOGIN_SERVER: acrsynapse18683.azurecr.io
  RESOURCE_GROUP: rg-synapse

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      image_tag:
        description: "Image tag to build and deploy"
        required: true
        default: latest

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag || 'latest' }} to ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    # On push: targets dev (no approval needed). On manual: targets selected env.
    environment: ${{ inputs.environment || 'dev' }}
    env:
      DEPLOY_ENV: ${{ inputs.environment || 'dev' }}
      IMAGE_TAG:  ${{ inputs.image_tag  || 'latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name "${{ env.ACR_NAME }}"

      - name: Build & push core image
        run: |
          docker build -t "${{ env.ACR_LOGIN_SERVER }}/synapse:${{ env.IMAGE_TAG }}" .
          docker push "${{ env.ACR_LOGIN_SERVER }}/synapse:${{ env.IMAGE_TAG }}"

      - name: Build & push NOC dashboard image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t "${{ env.ACR_LOGIN_SERVER }}/synapse-noc:${{ env.IMAGE_TAG }}" \
            ./frontend
          docker push "${{ env.ACR_LOGIN_SERVER }}/synapse-noc:${{ env.IMAGE_TAG }}"

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name:   ${{ secrets.CLUSTER_NAME }}

      - name: Render manifests (pin image)
        run: |
          OVERLAY_DIR="k8s/overlays/${{ env.DEPLOY_ENV }}"
          IMAGE_REF="${{ env.ACR_LOGIN_SERVER }}/synapse:${{ env.IMAGE_TAG }}"
          NOC_REF="${{ env.ACR_LOGIN_SERVER }}/synapse-noc:${{ env.IMAGE_TAG }}"
          (cd "${OVERLAY_DIR}" && \
            kustomize edit set image "synapse=${IMAGE_REF}" && \
            kustomize edit set image "synapse-noc=${NOC_REF}")
          kubectl kustomize "${OVERLAY_DIR}" > /tmp/manifests.yaml
          echo "── Rendered manifests ──"
          grep -E '^(apiVersion|kind|  name:|  namespace:|  - host:|        image:)' /tmp/manifests.yaml || true

      - name: Apply manifests
        run: kubectl apply -f /tmp/manifests.yaml

      # Sync AKV → k8s Secret before rollout so the pod always starts with
      # the correct env vars. The Secrets Store CSI driver has a race condition
      # with Recreate deployments (old pod dies, new pod's env vars are resolved
      # from the k8s Secret before the CSI driver finishes writing fresh AKV
      # values). This step removes that dependency entirely.
      - name: Sync AKV secrets → k8s Secret
        run: |
          NS="synapse-${{ env.DEPLOY_ENV }}"
          AKV="kv-synapse18683"

          SYNAPSE_API_KEYS=$(az keyvault secret show \
            --vault-name "${AKV}" \
            --name "SYNAPSE-API-KEYS-DEV" \
            --query value -o tsv)

          kubectl patch secret synapse-secrets -n "${NS}" --type='json' -p="[
            {\"op\":\"replace\",\"path\":\"/data/SYNAPSE_API_KEYS\",
             \"value\":\"$(echo -n "${SYNAPSE_API_KEYS}" | base64 -w 0)\"}
          ]" 2>/dev/null || echo "Secret not yet initialised — CSI driver will create it on first mount"

      - name: Force rollout (picks up new :latest image)
        run: |
          kubectl -n "synapse-${{ env.DEPLOY_ENV }}" rollout restart deployment/synapse
          kubectl -n "synapse-${{ env.DEPLOY_ENV }}" rollout restart deployment/synapse-noc || true

      - name: Wait for rollout
        run: |
          kubectl -n "synapse-${{ env.DEPLOY_ENV }}" \
            rollout status deployment/synapse --timeout=5m

      - name: Show endpoint
        run: |
          URL="https://${{ env.DEPLOY_ENV }}.42-ds.net"
          echo ""
          echo "✓ Deployed to: ${URL}"
          echo "  Health:      ${URL}/health"
          echo "  Swagger:     ${URL}/docs"
          echo ""
          echo "::notice title=Deployed::${URL}/docs"
