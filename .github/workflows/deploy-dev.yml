name: Deploy Synapse Core to Azure AKS Dev

on:
  push:
    branches: [ main, develop ]

env:
  ACR_NAME: acrtelcoagent18683
  RESOURCE_GROUP: rg-telco-agent
  CLUSTER_NAME: aks-synapse
  NAMESPACE: telco-agent-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate with Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr login --name $ACR_NAME
          docker build -t $ACR_NAME.azurecr.io/telco-agent:${{ github.sha }} .
          docker push $ACR_NAME.azurecr.io/telco-agent:${{ github.sha }}

      - name: Set AKS cluster context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Roll out updated image
        run: |
          kubectl set image deployment/telco-agent \
            api=$ACR_NAME.azurecr.io/telco-agent:${{ github.sha }} \
            -n $NAMESPACE
          kubectl rollout status deployment/telco-agent -n $NAMESPACE --timeout=120s
