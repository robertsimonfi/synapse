name: Deploy Synapse Core to Azure AKS Dev

on:
  push:
    branches: [ main, develop ]

env:
  ACR_NAME: acrsynapse18683
  RESOURCE_GROUP: rg-synapse
  CLUSTER_NAME: aks-synapse
  NAMESPACE: synapse-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate with Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr login --name $ACR_NAME
          docker build -t acrsynapse18683.azurecr.io/synapse:${{ github.sha }} .
          docker push acrsynapse18683.azurecr.io/synapse:${{ github.sha }}

      - name: Set AKS cluster context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Ensure namespace exists
        run: |
          kubectl get ns $NAMESPACE >/dev/null 2>&1 || kubectl create ns $NAMESPACE

      - name: Roll out updated image
        run: |
          kubectl set image deployment/synapse \
            api=acrsynapse18683.azurecr.io/synapse:${{ github.sha }} \
            -n $NAMESPACE
          kubectl rollout status deployment/synapse -n $NAMESPACE --timeout=120s
