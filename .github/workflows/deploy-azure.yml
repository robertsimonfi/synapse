# Deploys the latest pushed image to Azure Container Apps.
# Manually triggered (workflow_dispatch) — graduate to push-triggered once you trust it.
#
# Required GitHub secrets:
#   AZURE_CREDENTIALS         — output of: az ad sp create-for-rbac --sdk-auth ...
#   AZURE_RESOURCE_GROUP      — e.g. rg-telco-agent
#   AZURE_CONTAINERAPP_NAME   — e.g. telco-agent-api
#   ANTHROPIC_API_KEY         — Anthropic API key for the running container
#
# One-time prep (locally, before first deploy):
#   az login
#   az group create -n rg-telco-agent -l westeurope
#   az containerapp env create -n telco-agent-env -g rg-telco-agent -l westeurope
#   az containerapp create \
#       --name telco-agent-api \
#       --resource-group rg-telco-agent \
#       --environment telco-agent-env \
#       --image ghcr.io/<your-org>/<your-repo>:latest \
#       --target-port 8000 --ingress external \
#       --registry-server ghcr.io \
#       --registry-username <github-user> \
#       --registry-password <ghcr-pat-with-read:packages> \
#       --secrets anthropic-api-key=<your-key> \
#       --env-vars ANTHROPIC_API_KEY=secretref:anthropic-api-key DB_TYPE=sqlite

name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. latest, sha-abc1234)"
        required: true
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App image
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "${{ secrets.AZURE_CONTAINERAPP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}"

      - name: Show app URL
        uses: azure/cli@v2
        with:
          inlineScript: |
            FQDN=$(az containerapp show \
              --name "${{ secrets.AZURE_CONTAINERAPP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --query properties.configuration.ingress.fqdn -o tsv)
            echo "Deployed to: https://${FQDN}"
            echo "Swagger:     https://${FQDN}/docs"
