# nginx config for the Synapse NOC Dashboard frontend container.
# CORE_HOST / CORE_PORT are injected at container startup via envsubst.

upstream core_upstream {
    server ${CORE_HOST}:${CORE_PORT};
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Static asset caching ───────────────────────────────────────────────
    location ~* \.(?:js|css|woff2?|png|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── REST API proxy (strips /api prefix before forwarding to core) ──────
    location /api/ {
        proxy_pass         http://core_upstream/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── WebSocket proxy (NOC live event stream) ────────────────────────────
    location /ws/ {
        proxy_pass         http://core_upstream/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── SPA fallback ───────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
